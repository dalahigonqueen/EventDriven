<!DOCTYPE html>
<html>
<head>
    <title>Activity 8</title>
    <script src=""scriptLoop.js></script>
    <link rel="stylesheet" href="styles.css">
    
    </style>
</head>
<body>
    <div class="row">

        <FOR LOOP>
        <div class="left">
            <h2>For Loop</h2>
            <form id="forForm">
                <table>
                    <tr>
                        <td><label for="num1">Enter number :</label></td>
                        <td><input type="text" id="num1" name="num1"></td>
                    </tr>
                    <tr>
                        <td><label for="txt1">Enter text :</label></td>
                        <td><input type="text" id="txt1" name="txt1"></td>
                    </tr>
                    <tr>
                        <td>
                            <button type="button" onclick="showForLoop()">Show</button>
                            <button type="reset" onclick="clearFields1()">Clear</button>
                        </td>
                    </tr>
                </table>
            </form>
            <p id="output1"></p>
        </div>

        <WHILE LOOP>
        <div class="center">
            <h2>While Loop</h2>
            <form id="loopForm">
                <table>
                    <tr>
                        <td><label for="num2">Enter number :</label></td>
                        <td><input type="text" id="num2" name="num2"></td>
                    </tr>
                    <tr>
                        <td><label for="txt2">Enter text :</label></td>
                        <td><input type="text" id="txt2" name="txt2"></td>
                    </tr>
                    <tr>
                        <td>
                            <button type="button" onclick="showWhileLoop()">Show</button>
                            <button type="reset" onclick="clearFields2()">Clear</button>
                        </td>
                    </tr>
                </table>
            </form>
            <p id="output2"></p>
        </div>

        <DO WHILE LOOP>
        <div class="right">
            <h2>Do While Loop</h2>
            <form id="doWhileForm">
                <table>
                    <tr>
                        <td><label for="num3">Enter number :</label></td>
                        <td><input type="text" id="num3" name="num3"></td>
                    </tr>
                    <tr>
                        <td><label for="txt3">Enter text :</label></td>
                        <td><input type="text" id="txt3" name="txt3"></td>
                    </tr>
                    <tr>
                        <td>
                            <button type="button" onclick="showDoWhileLoop()">Show</button>
                            <button type="reset" onclick="clearFields3()">Clear</button>
                        </td>
                    </tr>
                </table>
            </form>
            <p id="output3"></p>
        </div>

    </div>

    <script src="scriptLoop.js"></script>
</body>
</html>
