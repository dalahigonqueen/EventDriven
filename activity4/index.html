<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="header">
            <p>NBSC CampusWear</p>
        </div>

        <div id="nav">
            <a href="home.html" target="main" onclick="showPage()">Home</a>
            <a href="about.html" target="main" onclick="showPage()">About</a>
            <a href="products.html" target="main" onclick="showPage()">Products</a>
        </div>

        <div class="main">

            <div class="welcome" id="welcome">
                <h1>Welcome to NBSC CampusWear!</h1>
                <p>Ready for school, ready for anything.</p>
            </div>

            <iframe name="main"></iframe>

        </div>

        <div class="footer">
            <p>Made for students, made for you. &copy; 2026.</p>
        </div>

        <script>
            function showPage() {
                document.getElementById("welcome").style.display = "none";
                document.querySelector(".main iframe").style.display = "block";
            }
        </script>

    </body>
</html>
